name: desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Since Gate B, :core depends on voidbind-client (shared Credential.Device), pulled from
    # the org's GitHub Packages — the repo in settings.gradle.kts authenticates with these.
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs the Android SDK and exports ANDROID_HOME, which switches ON the android
      # target in :core / :ui (they register it only when an SDK is present — see their
      # build scripts). Without this step the build stays JVM-only, exactly like a
      # desktop dev box with no SDK. Matches heyarr-mobile's known-green setup.
      # Use the runner's preinstalled Android SDK + accept licenses deterministically
      # (android-actions/setup-android re-downloads cmdline-tools whose license re-accept
      # fails non-interactively). Same fix as android.yml / android-release.yml.
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Skiko dlopens these even when rendering off-screen.
      - name: Skia runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libfontconfig1 libx11-6 libxrender1 libxtst6 libxi6

      # Scoped to the desktop + shared modules ONLY. A bare `./gradlew build` would also
      # build :androidApp (heyarr-mobile) — that's the separate android.yml job. Since Gate B,
      # :core depends on voidbind-client (shared Credential.Device), so this job now needs the
      # packages:read token (see env above); settings.gradle.kts authenticates the repo with it.
      - name: Build + JVM unit tests
        run: ./gradlew :core:build :ui:build :composeApp:build --no-daemon --stacktrace

      # The runnable fat JAR for the HEADLESS vault-sync daemon: Compose's supported uber-jar
      # task bundles the whole runtime classpath (incl. voidbind-client) with service files
      # merged. Its built-in Main-Class is the GUI window, so the daemon is launched by class
      # name on the classpath (see docs/vault-sync-daemon.md) — this step just produces the JAR.
      - name: Package headless vault-sync uber JAR
        run: ./gradlew :composeApp:packageUberJarForCurrentOS --no-daemon --stacktrace

      - name: Upload vault-sync JAR
        uses: actions/upload-artifact@v4
        with:
          name: heyarr-vault-sync-jar
          path: composeApp/build/compose/jars/*.jar
          if-no-files-found: error

      - name: Screenshots (off-screen, fixture data)
        run: ./gradlew :composeApp:screenshots --no-daemon
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: heyarr-desktop-screenshots
          path: composeApp/build/screenshots/*.png
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heyarr-desktop-test-reports
          path: composeApp/build/reports/tests/**
          if-no-files-found: ignore
