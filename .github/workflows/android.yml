name: android

# Path-filtered: a change that cannot affect this build does not run it. The shared
# modules and the Gradle build itself trigger every workflow; only :androidApp
# triggers the android ones.
on:
  push:
    branches: [main]
    paths:
      - "androidApp/**"
      - "core/**"
      - "vault-client/**"
      - "ui/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".editorconfig"
      - ".github/workflows/android.yml"
  # Pull requests run this via ci.yml (workflow_call), which applies the same path
  # filter and reports one always-present `ci` check that branch protection requires.
  # Keep the path lists here and in ci.yml's `changes` job in sync.
  workflow_call:

# Cancel superseded runs on the same ref.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# The workflow token only needs to read the repo and pull the private
# `voidbind-client` artifact from the same org's GitHub Packages.
permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Gradle resolves `one.rarebit.voidwhichbinds:void-which-binds-client` from GitHub Packages
    # (settings.gradle.kts) with these credentials.
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # Use the runner's preinstalled Android SDK and accept licenses deterministically.
      # (android-actions/setup-android re-downloads a newer cmdline-tools whose license
      # re-accept fails non-interactively — "6 of 7 licenses not accepted".)
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # ktlint + detekt over :androidApp. Pre-existing findings are frozen in
      # androidApp/config/{ktlint,detekt}/baseline.xml, so only NEW violations fail.
      # (:core / :ui are linted by desktop.yml, which the same shared paths trigger.)
      - name: Lint (ktlint + detekt)
        run: ./gradlew :androidApp:ktlintCheck :androidApp:detekt --no-daemon --stacktrace

      # :vault-client's golden vectors (frame codec, key chain, drive CRDT) also run in the
      # Android unit-test runtime, so its android variant is proven like the JVM one.
      - name: Unit tests
        run: ./gradlew :androidApp:testDebugUnitTest :vault-client:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      # The release variant's network-security config is generated (androidApp/build.gradle.kts);
      # linking its resources proves the manifest's @xml/network_security_config resolves. Run
      # with a sample cleartext host so the generator's host check is exercised too.
      - name: Release resources link
        run: >-
          ./gradlew :androidApp:processReleaseResources -PheyarrCleartextHosts=192.0.2.10
          --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heyarr-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
