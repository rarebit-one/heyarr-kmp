name: android

# Path-filtered: a change that cannot affect this build does not run it. The shared
# modules and the Gradle build itself trigger every workflow; only :androidApp
# triggers the android ones.
on:
  push:
    branches: [main]
    paths:
      - "androidApp/**"
      - "core/**"
      - "ui/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".editorconfig"
      - ".github/workflows/android.yml"
  # Pull requests run this via ci.yml (workflow_call), which applies the same path
  # filter and reports one always-present `ci` check that branch protection requires.
  # Keep the path lists here and in ci.yml's `changes` job in sync.
  workflow_call:

# Cancel superseded runs on the same ref.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# The workflow token only needs to read the repo and pull the private
# `voidbind-client` artifact from the same org's GitHub Packages.
permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Gradle resolves `one.rarebit.voidbind:voidbind-client` from GitHub Packages
    # (settings.gradle.kts) with these credentials.
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      # Use the runner's preinstalled Android SDK and accept licenses deterministically.
      # (android-actions/setup-android re-downloads a newer cmdline-tools whose license
      # re-accept fails non-interactively — "6 of 7 licenses not accepted".)
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # ktlint + detekt over :androidApp. Pre-existing findings are frozen in
      # androidApp/config/{ktlint,detekt}/baseline.xml, so only NEW violations fail.
      # (:core / :ui are linted by desktop.yml, which the same shared paths trigger.)
      - name: Lint (ktlint + detekt)
        run: ./gradlew :androidApp:ktlintCheck :androidApp:detekt --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew :androidApp:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heyarr-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
