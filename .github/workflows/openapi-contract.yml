name: openapi-contract

# The hand-written wire parsers held to heyarr-core's OpenAPI document (:core's
# OpenApiContractTest, which reads every module's parser sources as text).
#
# - `contract` runs on every change that can move a parser or the vendored spec. desktop.yml
#   runs it too (it is part of :core:build), but desktop.yml does not trigger on an
#   :androidApp-only change — and half the parsers live there.
# - `upstream` runs weekly (and on demand) against heyarr-core's CURRENT main: it fails when
#   main's spec breaks a parser here, and warns when the vendored copy is merely behind.
on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "composeApp/**"
      - "androidApp/**"
      - "ui/**"
      - "scripts/refresh-openapi-spec.sh"
      - ".github/workflows/openapi-contract.yml"
  # Pull requests run this via ci.yml (workflow_call), which applies the same path
  # filter and reports one always-present `ci` check that branch protection requires.
  # Keep the path lists here and in ci.yml's `changes` job in sync.
  workflow_call:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: openapi-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  contract:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # :core resolves voidbind-client from GitHub Packages (see settings.gradle.kts).
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # JVM-only on purpose: with no SDK in the environment, :core is JVM-only and :androidApp
      # is left out of the build (the test reads its sources as text, it does not compile them).
      - name: Contract test
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT
          ./gradlew :core:jvmTest --tests 'one.rarebit.heyarr.core.contract.*' --no-daemon --stacktrace

  upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Is the vendored spec behind heyarr-core main?
        id: behind
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --user pyyaml
          if scripts/refresh-openapi-spec.sh --check main; then
            echo "behind=false" >>"$GITHUB_OUTPUT"
          else
            echo "behind=true" >>"$GITHUB_OUTPUT"
            echo "::warning title=openapi spec behind::The vendored spec differs from heyarr-core main — run scripts/refresh-openapi-spec.sh and open a PR."
          fi
      - name: Contract test against heyarr-core main's spec
        if: steps.behind.outputs.behind == 'true'
        run: |
          scripts/refresh-openapi-spec.sh main
          git diff --stat
          unset ANDROID_HOME ANDROID_SDK_ROOT
          ./gradlew :core:jvmTest --tests 'one.rarebit.heyarr.core.contract.*' --no-daemon --stacktrace
