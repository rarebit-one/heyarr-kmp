name: instrumented
# On-device smoke test on an emulator: renders real screens against the preview node
# (androidApp/src/androidTest). The JVM unit tests in android.yml cannot see Android-only
# behaviour — a regex the phone's ICU engine refuses, a layout Compose rejects at
# measure time — and both have shipped past them (heyarr-mobile #47, #49). Runs
# alongside unit tests on PRs and main so post-merge regressions remain visible.

# Path-filtered: a change that cannot affect this build does not run it. The shared
# modules and the Gradle build itself trigger every workflow; only :androidApp
# triggers the android ones.
on:
  push:
    branches: [main]
    paths:
      - "androidApp/**"
      - "core/**"
      - "ui/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/instrumented.yml"
  # Pull requests run this via ci.yml (workflow_call), which applies the same path
  # filter and reports one always-present `ci` check that branch protection requires.
  # Keep the path lists here and in ci.yml's `changes` job in sync.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      # Match android.yml: use the runner's installed SDK instead of downloading
      # command-line tools that can fail non-interactive license acceptance.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Run the on-device smoke tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :androidApp:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Verify the smoke tests actually ran
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = {"aMovieDetailRenders", "aFeedDetailRenders", "aSeriesDetailRenders"}
          executed = set()
          reports = Path("androidApp/build/outputs/androidTest-results/connected")
          for report in reports.rglob("TEST-*.xml"):
              for case in ET.parse(report).iter("testcase"):
                  if case.get("classname") != "one.rarebit.heyarr.mobile.DetailScreenSmokeTest":
                      continue
                  if any(case.find(tag) is not None for tag in ("skipped", "failure", "error")):
                      raise SystemExit(f"Smoke test did not pass: {case.get('name')} ({report})")
                  executed.add(case.get("name"))
          missing = expected - executed
          if missing:
              raise SystemExit(f"Smoke tests were not exercised: {sorted(missing)}")
          print(f"Verified {len(expected)} Android smoke tests executed successfully")
          PYTEST

      - name: Upload the instrumented test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instrumented-report
          path: |
            androidApp/build/reports/androidTests/connected/
            androidApp/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
