name: android-release

# Cuts a signed, installable Android release. Triggered by a `v*` tag: builds the
# release APK for :androidApp signed with the release keystore (repo secrets), then
# publishes it as the tag's GitHub Release asset — the artefact the phone installs.
# Ported from the pre-consolidation heyarr-mobile release.yml (:app -> :androidApp).
#
# The debug CI (android.yml) is unchanged and remains the merge gate.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for"
        required: true

# `contents: write` publishes the Release; `packages: read` resolves the private
# `one.rarebit.voidbind:voidbind-client` artifact (settings.gradle.kts).
permissions:
  contents: write
  packages: read

concurrency:
  group: android-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the version from the tag
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      # Use the runner's preinstalled Android SDK + accept licenses deterministically
      # (android-actions/setup-android re-downloads cmdline-tools whose license re-accept
      # fails non-interactively — "6 of 7 licenses not accepted"). ANDROID_HOME stays set,
      # so the later apksigner step (build-tools) still resolves.
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      # Cache DISABLED for releases: a stale build-cache entry poisoned the release
      # variant with older-Kotlin artifacts ("metadata 2.3.0, expected 2.0.0"). Releases
      # are infrequent — correctness over cache speed; always compile from clean.
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-disabled: true

      - name: Assemble the signed release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew :androidApp:assembleRelease
          -PreleaseVersionName=${{ steps.version.outputs.tag }}
          --no-daemon --stacktrace

      - name: Name the APK after the release
        id: apk
        run: |
          src="$(ls androidApp/build/outputs/apk/release/*.apk 2>/dev/null | head -1)"
          test -n "$src" && test -f "$src" || { echo "no release APK found"; ls -R androidApp/build/outputs/apk || true; exit 1; }
          out="heyarr-mobile-${{ steps.version.outputs.version }}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Prove it carries the release certificate
        run: |
          signer="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$signer" verify --print-certs "${{ steps.apk.outputs.path }}"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          {
            printf '**heyarr mobile %s**\n\n' "$VERSION"
            printf 'Signed release APK. Download and `adb install` it, or open this page\n'
            printf 'on the phone.\n\n'
            printf -- '- Version: `%s`\n' "$VERSION"
            printf -- '- Tag: `%s`\n' "$TAG"
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Signed with the heyarr release key (`apksigner verify` ran in CI).\n'
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "heyarr mobile $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" "$APK" --title "heyarr mobile $VERSION" --notes-file notes.md
          fi
