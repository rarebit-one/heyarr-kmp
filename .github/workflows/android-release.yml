name: android-release

# Stable app tags publish Linux installers and a signed Android APK.
# Prerelease tags publish the signed APK.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for"
        required: true

# `contents: write` publishes the Release; `packages: read` resolves the private
# `one.rarebit.voidwhichbinds:void-which-binds-client` artifact (settings.gradle.kts).
permissions:
  contents: write
  packages: read

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the version from the tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="${RELEASE_TAG}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || exit 1
          if [[ "$tag" == *-* ]]; then stable=false; else stable=true; fi
          printf 'stable=%s\ntag=%s\nversion=%s\n' "$stable" "$tag" "${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # Use the runner's preinstalled Android SDK + accept licenses deterministically
      # (android-actions/setup-android re-downloads cmdline-tools whose license re-accept
      # fails non-interactively — "6 of 7 licenses not accepted"). ANDROID_HOME stays set,
      # so the later apksigner step (build-tools) still resolves.
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      # Cache DISABLED for releases: a stale build-cache entry poisoned the release
      # variant with older-Kotlin artifacts ("metadata 2.3.0, expected 2.0.0"). Releases
      # are infrequent — correctness over cache speed; always compile from clean.
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-disabled: true

      # The deployment the published APK points at comes from repo secrets, never from the
      # (public) source; Gradle reads ORG_GRADLE_PROJECT_<name> as the <name> property. A
      # release without a node URL would ship pointing at the reserved placeholder and strand
      # every phone that updates, so refuse to build one.
      - name: Require the deployment secrets
        env:
          HEYARR_BASE_URL: ${{ secrets.HEYARR_BASE_URL }}
        run: |
          [ -n "$HEYARR_BASE_URL" ] || { echo "::error::repo secret HEYARR_BASE_URL is not set"; exit 1; }

      - name: Assemble the signed release APK
        env:
          ORG_GRADLE_PROJECT_heyarrBaseUrl: ${{ secrets.HEYARR_BASE_URL }}
          ORG_GRADLE_PROJECT_heyarrDnsHost: ${{ secrets.HEYARR_DNS_HOST }}
          ORG_GRADLE_PROJECT_heyarrCleartextHosts: ${{ secrets.HEYARR_CLEARTEXT_HOSTS }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew :androidApp:assembleRelease
          -PreleaseVersionName=${{ steps.version.outputs.tag }}
          --no-daemon --stacktrace

      - name: Name the APK after the release
        id: apk
        run: |
          src=(androidApp/build/outputs/apk/release/*.apk)
          [[ ${#src[@]} == 1 && -f "${src[0]}" ]]
          out="heyarr-mobile-${{ steps.version.outputs.version }}.apk"
          cp "${src[0]}" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Prove it carries the release certificate
        run: |
          signer="$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$signer" verify --print-certs "${{ steps.apk.outputs.path }}"

      - name: Build and verify Linux installers
        if: steps.version.outputs.stable == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm fakeroot
          ./gradlew :composeApp:packageDeb :composeApp:packageRpm "-PdesktopPackageVersion=$VERSION" --no-daemon
          deb=(composeApp/build/compose/binaries/main/deb/*.deb)
          rpm=(composeApp/build/compose/binaries/main/rpm/*.rpm)
          [[ ${#deb[@]} == 1 && ${#rpm[@]} == 1 ]]
          deb_version=$(dpkg-deb -f "${deb[0]}" Version)
          [[ "${deb_version%-*}" == "$VERSION" && "$(dpkg-deb -f "${deb[0]}" Architecture)" == amd64 ]]
          [[ "$(rpm -qp --queryformat '%{VERSION} %{ARCH}' "${rpm[0]}")" == "$VERSION x86_64" ]]
          dpkg-deb -f "${deb[0]}" Depends | tr ',' '\n' | grep -E '^[[:space:]]*libmpv2([[:space:]]|$)'
          rpm -qp --requires "${rpm[0]}" | grep -x 'mpv-libs'
          dpkg-deb -c "${deb[0]}" | grep '/lib/app/resources/THIRD_PARTY_LICENSES.txt$'
          rpm -qlp "${rpm[0]}" | grep '/lib/app/resources/THIRD_PARTY_LICENSES.txt$'
          cp "${deb[0]}" "heyarr-desktop-${VERSION}-amd64.deb"
          cp "${rpm[0]}" "heyarr-desktop-${VERSION}-x86_64.rpm"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          STABLE: ${{ steps.version.outputs.stable }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          assets=("$APK")
          flags=()
          if [[ "$STABLE" == true ]]; then
            assets+=("heyarr-desktop-${VERSION}-amd64.deb" "heyarr-desktop-${VERSION}-x86_64.rpm")
            sha256sum "${assets[@]}" > SHA256SUMS
            assets+=(SHA256SUMS)
            printf 'Linux x86-64 installers for Ubuntu 24.04+ / Debian 13+ (DEB) and Fedora (RPM).\n\n' > notes.md
          else
            flags+=(--prerelease)
            : > notes.md
          fi
          printf 'Android APK signed with the heyarr release key and verified with apksigner.\n\n' >> notes.md
          printf 'Built from commit %s.\n' "$(git rev-parse HEAD)" >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "$TAG" --notes-file notes.md --generate-notes "${flags[@]}"
          fi
