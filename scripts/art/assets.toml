# The Archive illustration set, generated with Codex image generation (see README.md).
#
# Each [[asset]] is one image. Its prompt is the source of truth: the checked-in WebP is
# reproducible from it with `scripts/art/art.py build <id>`. Two styles exist:
#
#   pixel     — chrome art (postcards, fallback covers, vignettes). Snapped to a real pixel
#               grid and remapped to the palette below, so it sits in the token colours.
#   painterly — fictional fixture posters for the screenshot harness only. Never shipped.
#
# Every prompt must stay original: no text, no logos, no people's likenesses, and nothing
# from a film, game or franchise.

# Token colours plus an extended art ramp. Pixel assets are remapped to exactly these.
palette = [
  "#0A1410", "#0E1A15", "#111E18", "#172620", "#1E2F27", "#24382E", "#2C3D35",
  "#2E7D5B", "#3F8F6B", "#5BAE88", "#7EE0B3", "#B8E8CF", "#E6EBD7", "#F2E3C4",
  "#F4B860", "#C9893A",
]

[style.pixel]
preamble = """
An original retro-futurist pixel-art illustration. Chunky, clearly visible square pixels on a
coarse grid, no anti-aliasing, no dithering noise, flat colour areas. Palette strictly limited
to deep forest black #0A1410, dark greens #111E18 #1E2F27 #2E7D5B, pale mint #7EE0B3, chalk
#E6EBD7, and a single warm ochre accent #F4B860 used sparingly (one window light, one beacon).
Calm, quiet, slightly mysterious mood, like a postcard from a remote research outpost. No text,
no letters, no numbers, no logos, no people, no franchise symbols or recognisable designs.
"""

[style.painterly]
preamble = """
Original cinematic key art, painterly and atmospheric, rich full colour, soft volumetric
light, film-still composition. No text, no title, no letters, no logos, no watermark, no
recognisable people or likenesses, nothing from an existing film, show or game.
"""

